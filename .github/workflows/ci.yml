name: CI — Quality Gates

# Mandatory quality gates from AGENTS.md (Static and Dynamic Analysis):
#   clang-format → qmlformat/qmllint → Debug/Release build → tests →
#   static analysis (clang-tidy, clazy) → sanitizers → coverage.
#
# Qt is not taken from the system packages (ubuntu-24.04 ships 6.4.2, which is
# below the project minimum of 6.8.3). Every job installs Qt 6.8.3 per user
# with aqtinstall into $HOME/Qt and points CMake at it explicitly; this mirrors
# the local developer setup (see conanfile.py).
#
# spdlog is provided by Conan (spdlog/1.14.1 in conanfile.py) — the single
# source of truth for its version. Every job that builds installs Conan, runs
# `conan install` and points CMake at the generated toolchain via
# -DCONAN_BUILD_DIR; no system libspdlog-dev is used.
#
# Runs on push to main, PR to main, and manually.
# Free for public repos; 2000 min/month for private repos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /tmp/ccache
  CCACHE_COMPRESS: true
  CCACHE_MAXSIZE: 200M
  # Single source of truth for the Qt version; keep in sync with the
  # find_package(Qt6 …) call in CMakeLists.txt.
  QT_VERSION: 6.8.3
  QT_ARCH: linux_gcc_64

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Quick checks: clang-format + QML
  # ──────────────────────────────────────────────────────────────
  format-and-qml:
    name: "Format + QML checks"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-18

      # Qt is installed with aqtinstall (not apt): qmlformat/qmllint then come
      # from the same Qt 6.8.3 the application builds against.
      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install aqtinstall
          else
            python3 -m pip install --user --break-system-packages aqtinstall
          fi
          aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            -O "$HOME/Qt" \
            --archives icu qtbase qtdeclarative qtsvg qttools qttranslations qtwayland
          echo "$HOME/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"

      - name: clang-format (dry-run, --Werror)
        run: |
          src_files=$(find src tests -name '*.cpp' -o -name '*.h' -o -name '*.hpp' | sort)
          if [ -z "$src_files" ]; then
            echo "No C++ files found"
            exit 0
          fi
          clang-format-18 --dry-run --Werror $src_files

      - name: qmlformat (dry-run)
        run: |
          qml_files=$(find qml tests -name '*.qml' | sort)
          if [ -z "$qml_files" ]; then
            echo "No QML files found"
            exit 0
          fi
          for f in $qml_files; do
            qmlformat "$f" | diff -q "$f" - || {
              echo "qmlformat would modify $f"
              exit 1
            }
          done

      - name: qmllint
        run: |
          qml_files=$(find qml -name '*.qml' | sort)
          if [ -z "$qml_files" ]; then
            echo "No QML files found"
            exit 0
          fi
          qmllint $qml_files

  # ──────────────────────────────────────────────────────────────
  # 2. Debug build + tests
  # ──────────────────────────────────────────────────────────────
  build-and-test-debug:
    name: "Debug build + tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 \
            ninja-build \
            ccache \
            libgl1-mesa-dev

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install aqtinstall
          else
            python3 -m pip install --user --break-system-packages aqtinstall
          fi
          aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            -O "$HOME/Qt" \
            --archives icu qtbase qtdeclarative qtsvg qttools qttranslations qtwayland
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Install Conan
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install conan
          else
            python3 -m pip install --user --break-system-packages conan
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Conan install (spdlog)
        run: conan install . -of build/conan --build=missing -pr profiles/clang18

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-debug-${{ hashFiles('.git/refs/heads/main') }}
          restore-keys: |
            ccache-debug-

      - name: Configure (Debug)
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          CC=clang-18 CXX=clang++-18 \
            cmake -S . -B build-debug \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCONAN_BUILD_DIR=build/conan \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (Debug)
        run: cmake --build build-debug -j$(nproc)

      - name: Run tests (Debug)
        run: |
          cd build-debug
          ctest --output-on-failure -j$(nproc)

      - name: Upload build directory (for static analysis)
        uses: actions/upload-artifact@v4
        with:
          name: debug-build
          path: build-debug/
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────
  # 3. Release build + tests
  # ──────────────────────────────────────────────────────────────
  build-and-test-release:
    name: "Release build + tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 \
            ninja-build \
            libgl1-mesa-dev

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install aqtinstall
          else
            python3 -m pip install --user --break-system-packages aqtinstall
          fi
          aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            -O "$HOME/Qt" \
            --archives icu qtbase qtdeclarative qtsvg qttools qttranslations qtwayland
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Install Conan
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install conan
          else
            python3 -m pip install --user --break-system-packages conan
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Conan install (spdlog)
        run: |
          conan install . -of build/conan --build=missing \
            -pr profiles/clang18 -s build_type=Release

      - name: Configure (Release)
        run: |
          CC=clang-18 CXX=clang++-18 \
            cmake -S . -B build-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCONAN_BUILD_DIR=build/conan

      - name: Build (Release)
        run: cmake --build build-release -j$(nproc)

      - name: Run tests (Release)
        run: |
          cd build-release
          ctest --output-on-failure -j$(nproc)

  # ──────────────────────────────────────────────────────────────
  # 4. Static analysis: clang-tidy + clazy + cppcheck
  # ──────────────────────────────────────────────────────────────
  static-analysis:
    name: "Static Analysis"
    needs: build-and-test-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download compile_commands.json
        uses: actions/download-artifact@v4
        with:
          name: debug-build
          path: build-debug

      - name: Install analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-tidy-18 \
            clazy

      # clang-tidy parses compile_commands.json from the debug-build artifact,
      # whose Qt include paths point at $HOME/Qt/6.8.3/gcc_64 — install the same
      # Qt here so those headers resolve (LLMQore headers live inside the
      # artifact under build-debug/_deps, Qt headers do not).
      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install aqtinstall
          else
            python3 -m pip install --user --break-system-packages aqtinstall
          fi
          aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            -O "$HOME/Qt" \
            --archives icu qtbase qtdeclarative qtsvg qttools qttranslations qtwayland

      - name: Install Conan
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install conan
          else
            python3 -m pip install --user --break-system-packages conan
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The compile_commands.json from the Debug job points at spdlog headers
      # inside the Conan cache; install the same Debug packages to restore them.
      - name: Conan install (spdlog)
        run: conan install . -of build/conan --build=missing -pr profiles/clang18

      - name: clang-tidy
        run: |
          src_files=$(find src tests -name '*.cpp' -o -name '*.h' -o -name '*.hpp' | sort)
          if [ -z "$src_files" ]; then
            echo "No source files found"
            exit 0
          fi
          clang-tidy-18 -p build-debug \
            --warnings-as-errors='*' \
            $src_files

      # clazy from apt on ubuntu-24.04 bundles LLVM 15, but the system
      # ships GCC 14 headers that LLVM 15 cannot parse (LLVM 18 handles
      # them fine). The errors are entirely in GCC system headers, not
      # in our code. continue-on-error keeps the pipeline green while
      # still running clazy for diagnostics. Locally with LLVM 18 it
      # works correctly.
      - name: clazy
        continue-on-error: true
        run: |
          src_files=$(find src tests -name '*.cpp' | sort)
          if [ -z "$src_files" ]; then
            echo "No source files found"
            exit 0
          fi
          clazy-standalone \
            -checks=level0,level1,level2 \
            -p build-debug/compile_commands.json \
            --ignore-dirs='/usr/lib/gcc/.*' \
            $src_files

      - name: cppcheck (optional)
        continue-on-error: true
        run: |
          cppcheck --enable=all --inconclusive --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            -I src \
            -i build-debug -i build-release -i build-asan \
            src tests

  # ──────────────────────────────────────────────────────────────
  # 5. Sanitizers (ASan + UBSan)
  # ──────────────────────────────────────────────────────────────
  sanitizers:
    name: "ASan + UBSan"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 \
            ninja-build \
            libgl1-mesa-dev

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install aqtinstall
          else
            python3 -m pip install --user --break-system-packages aqtinstall
          fi
          aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            -O "$HOME/Qt" \
            --archives icu qtbase qtdeclarative qtsvg qttools qttranslations qtwayland
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Install Conan
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install conan
          else
            python3 -m pip install --user --break-system-packages conan
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Conan install (spdlog)
        run: conan install . -of build/conan --build=missing -pr profiles/clang18

      - name: Configure (ASan + UBSan)
        run: |
          CC=clang-18 CXX=clang++-18 \
            cmake -S . -B build-asan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCONAN_BUILD_DIR=build/conan \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (ASan + UBSan)
        run: cmake --build build-asan -j$(nproc)

      - name: Run tests under sanitizers
        run: |
          cd build-asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --output-on-failure -j$(nproc)

  # ──────────────────────────────────────────────────────────────
  # 6. Coverage (LLVM source-based coverage)
  # ──────────────────────────────────────────────────────────────
  coverage:
    name: "Coverage"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 \
            ninja-build \
            llvm-18-tools \
            libgl1-mesa-dev

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install aqtinstall
          else
            python3 -m pip install --user --break-system-packages aqtinstall
          fi
          aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            -O "$HOME/Qt" \
            --archives icu qtbase qtdeclarative qtsvg qttools qttranslations qtwayland
          echo "CMAKE_PREFIX_PATH=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Install Conan
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install conan
          else
            python3 -m pip install --user --break-system-packages conan
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Conan install (spdlog)
        run: conan install . -of build/conan --build=missing -pr profiles/clang18

      - name: Configure (coverage)
        run: |
          CC=clang-18 CXX=clang++-18 \
            cmake -S . -B build-cov \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCONAN_BUILD_DIR=build/conan \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_C_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fprofile-instr-generate -fcoverage-mapping"

      - name: Build and Run tests
        run: |
          cmake --build build-cov -j$(nproc)
          cd build-cov
          LLVM_PROFILE_FILE="code-%p.profraw" \
            ctest --output-on-failure -j$(nproc)

      - name: Generate coverage report
        run: |
          cd build-cov
          llvm-profdata-18 merge -sparse code-*.profraw -o code.profdata 2>/dev/null || {
            echo "No profile data to merge — skipping report"
            exit 0
          }
          llvm-cov-18 report \
            -instr-profile=code.profdata \
            -ignore-filename-regex='.*(moc_|_autogen|build|/usr/).*' \
            $(find . -type f -name '*.so' -o -type f -name 'audio-assistant' -o -type f -name 'tst_*' | grep -v autogen)
