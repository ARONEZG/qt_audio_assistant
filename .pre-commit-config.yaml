# ──────────────────────────────────────────────────────────────
# Pre-commit hooks — быстрые проверки перед каждым коммитом.
#
# Установка (один раз):
#   scripts/setup-git-hooks.sh
#
# ВНИМАНИЕ: `pre-commit install` в этом репозитории НЕ использовать —
# при установленном core.hooksPath он падает с отказом перезаписи
# .githooks/pre-commit (ожидаемая громкая ошибка). Quality-проверки
# делегируются из .githooks/pre-commit.
#
# Запуск вручную на всех файлах:
#   pre-commit run --all-files
#
# Пропустить hooks (только в исключительном случае):
#   git commit --no-verify -m "..."
#
# Полные quality gates (сборка, тесты, санитайзеры) — не здесь,
# они в CI и scripts/ci-check.sh.
# ──────────────────────────────────────────────────────────────

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: local
    hooks:
      # clang-format: project-owned .clang-format
      - id: clang-format
        name: "clang-format (C++)"
        entry: >
          bash -c '
            FILES=$(git diff --cached --name-only --diff-filter=ACMR |
                    grep -E "\.(cpp|h|hpp)$" || true);
            if [ -n "$FILES" ]; then
              clang-format-18 --dry-run --Werror $FILES;
            fi'
        language: system
        pass_filenames: false
        types: [c++]

      # qmlformat: project QML files. Uses the Qt the module is built against
      # (see static-analysis.sh): the distro qt6-tools are 6.4.2 and their
      # formatter garbles `pragma ComponentBehavior: Bound`, so they would flag
      # correctly formatted Qt 6 QML.
      - id: qmlformat
        name: "qmlformat"
        entry: >
          bash -c '
            QMLFORMAT="/usr/lib/qt6/bin/qmlformat";
            for prefix in "$HOME/Qt/6.8.3/gcc_64" "${QTDIR:-}" /opt/Qt/6.8.3/gcc_64; do
              if [ -n "$prefix" ] && [ -x "$prefix/bin/qmlformat" ]; then
                QMLFORMAT="$prefix/bin/qmlformat"; break;
              fi;
            done;
            FILES=$(git diff --cached --name-only --diff-filter=ACMR |
                    grep -E "\.qml$" || true);
            TMP=$(mktemp);
            for f in $FILES; do
              "$QMLFORMAT" "$f" > "$TMP";
              diff -q "$f" "$TMP" || { echo "qmlformat would modify $f"; exit 1; };
            done;
            rm -f "$TMP"'
        language: system
        pass_filenames: false
        types: [file]
        files: \.qml$

      # qmllint: QML lint. Uses the Qt the module is built against (see
      # static-analysis.sh): the distro qt6-tools are 6.4.2 and cannot parse the
      # generated *.qmltypes of a project module, so they reject valid QML.
      - id: qmllint
        name: "qmllint"
        entry: >
          bash -c '
            QMLLINT="/usr/lib/qt6/bin/qmllint";
            for prefix in "$HOME/Qt/6.8.3/gcc_64" "${QTDIR:-}" /opt/Qt/6.8.3/gcc_64; do
              if [ -n "$prefix" ] && [ -x "$prefix/bin/qmllint" ]; then
                QMLLINT="$prefix/bin/qmllint"; break;
              fi;
            done;
            FILES=$(git diff --cached --name-only --diff-filter=ACMR |
                    grep -E "\.qml$" || true);
            if [ -n "$FILES" ]; then
              "$QMLLINT" $FILES;
            fi'
        language: system
        pass_filenames: false
        types: [file]
        files: \.qml$
